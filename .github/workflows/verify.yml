name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reproduce-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check app.py compiles
        run: python -m py_compile app.py

      - name: Re-execute the notebook end-to-end
        run: |
          jupyter nbconvert --to notebook --execute \
            --output /tmp/executed_check.ipynb \
            --ExecutePreprocessor.timeout=600 \
            notebooks/Netflix_Analysis.ipynb

      - name: Confirm no errors in executed notebook
        run: |
          python -c "
          import json, sys
          nb = json.load(open('/tmp/executed_check.ipynb', encoding='utf-8'))
          errors = [
              (i, out.get('ename'), out.get('evalue'))
              for i, c in enumerate(nb['cells']) if c['cell_type'] == 'code'
              for out in c.get('outputs', []) if out.get('output_type') == 'error'
          ]
          if errors:
              for i, ename, evalue in errors:
                  print(f'ERROR in cell {i}: {ename}: {evalue}')
              sys.exit(1)
          print('Notebook executed cleanly, 0 errors.')
          "
